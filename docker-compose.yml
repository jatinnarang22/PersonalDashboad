# Local MongoDB for development — optional if backend USE_MEMORY_MONGO=true.
# Usage: docker compose up -d
# Then set USE_MEMORY_MONGO=false and MONGODB_URI in backend/.env

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
